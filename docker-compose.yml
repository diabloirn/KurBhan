services:
  auth-service:
    build:
      context: ./backend/internal/services/auth_service
      dockerfile: Dockerfile
    container_name: kurbhan-auth-service
    ports:
      - "${AUTH_SERVICE_PORT:-50051}:${AUTH_SERVICE_PORT:-50051}"
    env_file:
      - .env
    environment:
      - PORT=${AUTH_SERVICE_PORT:-50051}
    networks:
      - kurbhan-network

  rate-service:
    build:
      context: ./backend/internal/services/rate_service
      dockerfile: Dockerfile
    container_name: kurbhan-rate-service
    ports:
      - "${RATE_SERVICE_PORT:-50052}:${RATE_SERVICE_PORT:-50052}"
    env_file:
      - .env
    environment:
      - PORT=${RATE_SERVICE_PORT:-50052}
    depends_on:
      - memcached
    networks:
      - kurbhan-network

  shipment-service:
    build:
      context: ./backend/internal/services/shipment_service
      dockerfile: Dockerfile
    container_name: kurbhan-shipment-service
    ports:
      - "${SHIPMENT_SERVICE_PORT:-50053}:${SHIPMENT_SERVICE_PORT:-50053}"
    env_file:
      - .env
    environment:
      - PORT=${SHIPMENT_SERVICE_PORT:-50053}
    networks:
      - kurbhan-network

  payment-service:
    build:
      context: ./backend/internal/services/payment_service
      dockerfile: Dockerfile
    container_name: kurbhan-payment-service
    ports:
      - "${PAYMENT_SERVICE_PORT:-50054}:${PAYMENT_SERVICE_PORT:-50054}"
    env_file:
      - .env
    environment:
      - PORT=${PAYMENT_SERVICE_PORT:-50054}
    depends_on:
      - shipment-service
    networks:
      - kurbhan-network

  scraping-daemon:
    build:
      context: ./backend/internal/services/scraping_daemon
      dockerfile: Dockerfile
    container_name: kurbhan-scraping-daemon
    env_file:
      - .env
    depends_on:
      - rate-service
    networks:
      - kurbhan-network
    restart: unless-stopped

  memcached:
    image: memcached:alpine
    container_name: kurbhan-memcached
    ports:
      - "11211:11211"
    networks:
      - kurbhan-network

  envoy:
    image: envoyproxy/envoy:v1.28.0
    container_name: kurbhan-envoy
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml
    ports:
      - "${ENVOY_PORT:-8080}:8080"
      - "9901:9901"
    depends_on:
      - auth-service
      - rate-service
      - shipment-service
      - payment-service
    networks:
      - kurbhan-network

networks:
  kurbhan-network:
    driver: bridge