version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kurbhan-backend
    ports:
      - "50051:50051"
    environment:
      - DB_URI=postgresql://postgres.wgyzpzdnublmqfirikab:Diabloirn16......@aws-0-ap-northeast-1.pooler.supabase.com:6543/postgres
      - MEMCACHED_HOST=memcached:11211
      - PORT=50051
    depends_on:
      - memcached
    networks:
      - kurbhan-network

  envoy:
    image: envoyproxy/envoy:v1.28.0
    container_name: kurbhan-envoy
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml
    ports:
      - "9090:9090"
      - "9901:9901"
    depends_on:
      - backend
    networks:
      - kurbhan-network

  memcached:
    image: memcached:alpine
    container_name: kurbhan-memcached
    ports:
      - "11211:11211"
    networks:
      - kurbhan-network

networks:
  kurbhan-network:
    driver: bridge